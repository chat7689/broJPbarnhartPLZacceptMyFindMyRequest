<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find My — Ask JP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#080b12;
    --panel:#10151f;
    --sheet:#141b28;
    --line:#232c3d;
    --green:#30d98a;
    --blue:#5b8cff;
    --text:#f2f5f9;
    --text-dim:#93a0b4;
    --text-faint:#4c5769;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    background:var(--ink);
    color:var(--text);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .display{ font-family:'Space Grotesk', 'Inter', system-ui, sans-serif; }

  /* ---------- phone frame ---------- */

  .frame{
    position:relative;
    width:390px;
    max-width:100%;
    height:780px;
    max-height:92vh;
    background:var(--panel);
    border-radius:44px;
    border:1px solid var(--line);
    box-shadow:
      0 40px 80px -30px rgba(0,0,0,0.7),
      0 0 0 8px rgba(255,255,255,0.02) inset;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 22px 14px;
    flex-shrink:0;
  }

  .topbar h1{ font-size:19px; font-weight:600; margin:0; letter-spacing:0.2px; }

  .dots{
    display:flex; gap:4px; padding:8px;
    border-radius:10px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
  }
  .dots span{ width:3px; height:3px; border-radius:50%; background:var(--text-dim); display:block; }

  /* ---------- connection zone ---------- */

  .link-zone{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:26px;
    padding:0 30px;
  }

  .pair{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    gap:0;
  }

  .person{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    z-index:2;
    width:96px;
  }

  .avatar{
    width:64px; height:64px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:19px;
    border:1px solid var(--line);
  }
  .avatar.you{ background:linear-gradient(155deg, #2a3a55, #141a26); color:var(--text); }
  .avatar.jp{ background:linear-gradient(155deg, #3a4b6b, #1b2434); color:var(--text); }

  .person .label{ font-size:12.5px; color:var(--text-dim); text-align:center; }

  .track{
    position:relative;
    flex:1;
    height:2px;
    margin:0 -6px;
    top:-24px;
    background-image: linear-gradient(to right, var(--line) 0 6px, transparent 6px 12px);
    background-size:12px 2px;
    background-repeat:repeat-x;
  }

  .ping{
    position:absolute;
    top:50%; left:0;
    width:9px; height:9px;
    margin-top:-4.5px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px rgba(48,217,138,0.7);
    opacity:0;
  }
  .ping.go{ animation: travel 0.85s ease-in-out; }

  @keyframes travel{
    0%{ opacity:0; left:0; transform:scale(0.6); }
    12%{ opacity:1; transform:scale(1); }
    88%{ opacity:1; }
    100%{ opacity:0; left:100%; transform:scale(0.6) translateX(-100%); }
  }

  .status-block{
    text-align:center;
    max-width:300px;
  }
  .status-block .headline{
    font-size:15.5px;
    font-weight:500;
    margin:0 0 6px;
    transition:opacity .2s ease;
  }
  .status-block .sub{
    font-size:12.5px;
    color:var(--text-faint);
    margin:0;
  }

  /* ---------- bottom sheet ---------- */

  .sheet{
    flex-shrink:0;
    background:var(--sheet);
    border-top:1px solid var(--line);
    border-radius:26px 26px 0 0;
    padding:20px 22px 24px;
  }

  .bubble{
    background:rgba(91,140,255,0.1);
    border:1px solid rgba(91,140,255,0.22);
    border-radius:16px 16px 16px 4px;
    padding:12px 14px;
    font-size:14px;
    line-height:1.4;
    margin-bottom:16px;
    min-height:20px;
    transition:opacity .18s ease;
  }

  button.ask{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:none;
    background:var(--green);
    color:#06231a;
    font-size:15px;
    font-weight:600;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    transition: transform .15s ease, background .2s ease;
  }
  button.ask:active{ transform:scale(0.97); }
  button.ask:hover{ background:#3fe89a; }

  .counter{
    text-align:center;
    font-size:11.5px;
    color:var(--text-faint);
    margin:12px 0 0;
    letter-spacing:0.2px;
  }

  @media (prefers-reduced-motion: reduce){
    .ping.go{ animation:none; opacity:0; }
  }
</style>
</head>
<body>

<div class="frame">

  <div class="topbar">
    <h1 class="display">Find My</h1>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

  <div class="link-zone">
    <div class="pair">
      <div class="person">
        <div class="avatar you">M</div>
        <div class="label">You</div>
      </div>
      <div class="track"><div class="ping" id="ping"></div></div>
      <div class="person">
        <div class="avatar jp">JB</div>
        <div class="label">JP Barnhart</div>
      </div>
    </div>

    <div class="status-block">
      <p class="headline" id="headline">JP hasn't shared his location with you.</p>
      <p class="sub" id="subline">Send a request and hope for the best.</p>
    </div>
  </div>

  <div class="sheet">
    <div class="bubble" id="bubble">Hey, mind sharing your location for a sec?</div>
    <button class="ask" id="askBtn">Ask to Share Location</button>
    <p class="counter" id="counter">Requests sent: 0</p>
  </div>

</div>

<script>
  const messages = [
    "Hey, mind sharing your location for a sec?",
    "Just following up on that location share.",
    "Still hasn't come through, no rush though.",
    "This is now request number 4, for the record.",
    "JP.",
    "JP please.",
    "I will keep doing this.",
    "Okay now I'm invested.",
    "This is a bit, at this point.",
    "One tap. That's all it takes."
  ];

  const headlines = [
    "Request sent.",
    "Still waiting on JP.",
    "No response yet.",
    "Sent again, for good measure.",
    "JP has seen this. Probably."
  ];

  const bubble = document.getElementById('bubble');
  const headline = document.getElementById('headline');
  const subline = document.getElementById('subline');
  const counter = document.getElementById('counter');
  const ping = document.getElementById('ping');
  const btn = document.getElementById('askBtn');

  let count = 0;

  btn.addEventListener('click', () => {
    count++;
    btn.disabled = true;

    ping.classList.remove('go');
    void ping.offsetWidth;
    ping.classList.add('go');

    setTimeout(() => {
      const msgIndex = Math.min(count - 1, messages.length - 1);
      bubble.style.opacity = '0';
      headline.style.opacity = '0';
      setTimeout(() => {
        bubble.textContent = messages[msgIndex];
        headline.textContent = headlines[Math.min(count - 1, headlines.length - 1)];
        subline.textContent = count === 1 ? "Sent just now." : "Sent " + count + " times now.";
        counter.textContent = "Requests sent: " + count;
        bubble.style.opacity = '1';
        headline.style.opacity = '1';
        btn.disabled = false;
      }, 180);
    }, 500);
  });
</script>

</body>
</html>
