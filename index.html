<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bro plz jp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05050c;
    --glow1:#ff6b6b;
    --glow2:#ffa94d;
    --glow3:#ff6bcb;
    --glow4:#6b5bff;
    --green:#3ffca0;
    --blue:#4da9ff;
    --dim:#5a5a70;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    position:relative;
    cursor:pointer;
  }

  /* ambient background blobs */
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.3;
    pointer-events:none;
    z-index:0;
  }
  .b1{ width:440px; height:440px; background:var(--glow4); top:-130px; left:-110px; animation: drift1 20s ease-in-out infinite; }
  .b2{ width:400px; height:400px; background:var(--glow1); bottom:-150px; right:-100px; animation: drift2 24s ease-in-out infinite; }
  .b3{ width:320px; height:320px; background:var(--glow3); bottom:12%; left:6%; animation: drift3 17s ease-in-out infinite; }
  .b4{ width:300px; height:300px; background:var(--green); top:8%; right:10%; opacity:0.16; animation: drift2 21s ease-in-out infinite reverse; }

  @keyframes drift1{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(70px,55px); } }
  @keyframes drift2{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-60px,-45px); } }
  @keyframes drift3{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(35px,-35px) scale(1.12); } }

  /* radar tracker rings */
  .tracker{
    position:absolute;
    z-index:1;
    pointer-events:none;
  }
  .tracker .ring{
    position:absolute;
    left:50%; top:50%;
    border:2px solid var(--green);
    border-radius:50%;
    transform:translate(-50%,-50%) scale(0.4);
    opacity:0;
    animation: ring-pulse 2.6s ease-out infinite;
  }
  .tracker .ring.r2{ animation-delay:0.65s; }
  .tracker .ring.r3{ animation-delay:1.3s; }

  @keyframes ring-pulse{
    0%{ transform:translate(-50%,-50%) scale(0.25); opacity:0.85; }
    75%{ opacity:0.15; }
    100%{ transform:translate(-50%,-50%) scale(1.35); opacity:0; }
  }

  .tracker .dot{
    position:absolute;
    left:50%; top:50%;
    width:9px; height:9px;
    margin:-4.5px 0 0 -4.5px;
    border-radius:50%;
    background:var(--blue);
    box-shadow:0 0 10px 2px rgba(77,169,255,0.9);
    animation: dot-beat 1.4s ease-in-out infinite;
  }

  @keyframes dot-beat{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.5); }
  }

  /* ambient twinkling blue dots */
  .spark{
    position:absolute;
    border-radius:50%;
    background:var(--blue);
    box-shadow:0 0 6px 1px rgba(77,169,255,0.8);
    z-index:1;
    animation-name: twinkle;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(0.7); }
    50%{ opacity:1; transform:scale(1.3); }
  }

  /* falling / rising particles */
  .pin{
    position:absolute;
    bottom:-40px;
    font-size:20px;
    opacity:0;
    pointer-events:none;
    z-index:1;
    animation-name: rise;
    animation-timing-function: linear;
  }
  @keyframes rise{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.75; }
    90%{ opacity:0.45; }
    100%{ transform:translateY(-115vh) rotate(30deg); opacity:0; }
  }

  /* headline */
  .headline-wrap{
    position:relative;
    z-index:3;
    animation: wiggle 3.2s ease-in-out infinite;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  @keyframes wiggle{
    0%,100%{ transform:rotate(0deg); }
    25%{ transform:rotate(-1.1deg); }
    75%{ transform:rotate(1.1deg); }
  }

  .headline{
    max-width:920px;
    padding:0 28px;
    text-align:center;
    font-family:'Fredoka', system-ui, sans-serif;
    font-weight:700;
    line-height:1.1;
    letter-spacing:-0.01em;
    filter: drop-shadow(0 0 22px rgba(77,169,255,0.35));
  }
  .headline.big{ font-size:clamp(2.3rem, 8.4vw, 5.4rem); }
  .headline.mid{ font-size:clamp(1.3rem, 4.6vw, 2.6rem); }

  .headline .word{
    display:inline-block;
    margin:0 0.14em;
    opacity:0;
    transform:translateY(28px) scale(0.85) rotate(-3deg);
    background:linear-gradient(90deg, var(--glow1), var(--glow2), var(--glow3), var(--glow4), var(--green), var(--glow1));
    background-size:400% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation-name: pop-in, shimmer;
    animation-duration: 0.65s, 5s;
    animation-timing-function: cubic-bezier(.2,1.6,.4,1), linear;
    animation-iteration-count: 1, infinite;
    animation-fill-mode: forwards, none;
  }

  @keyframes pop-in{ to{ opacity:1; transform:translateY(0) scale(1) rotate(0deg); } }
  @keyframes shimmer{ to{ background-position: -400% 0; } }

  .hint{
    position:absolute;
    bottom:18px; left:0; right:0;
    text-align:center;
    font-family:'Fredoka', system-ui, sans-serif;
    font-size:11.5px;
    color:#3c3c4e;
    z-index:3;
  }

  .burst-emoji{
    position:fixed;
    font-size:20px;
    pointer-events:none;
    z-index:6;
    animation: burst 1s ease-out forwards;
  }
  @keyframes burst{
    0%{ opacity:1; transform:translate(0,0) scale(0.6) rotate(0deg); }
    100%{ opacity:0; transform:var(--end) scale(1.1) rotate(var(--rot)); }
  }

  @media (prefers-reduced-motion: reduce){
    .blob, .headline-wrap, .tracker .ring, .tracker .dot, .spark, .pin{ animation:none !important; }
    .tracker .ring{ opacity:0.3; transform:translate(-50%,-50%) scale(1); }
    .spark{ opacity:0.6; }
    .headline .word{ opacity:1; background-size:100% 100%; }
  }
</style>
</head>
<body id="body">

  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>

  <div id="trackers"></div>
  <div id="sparks"></div>
  <div id="pins"></div>

  <div class="headline-wrap">
    <h1 class="headline big" id="headline1"></h1>
    <h2 class="headline mid" id="headline2"></h2>
  </div>

  <p class="hint">tap anywhere</p>

<script>
  function buildWords(elId, text, baseDelay){
    const el = document.getElementById(elId);
    text.split(' ').forEach((w, i) => {
      const span = document.createElement('span');
      span.className = 'word';
      span.textContent = w;
      const d = baseDelay + i * 0.08;
      span.style.animationDelay = d + 's, ' + (d + 0.6) + 's';
      el.appendChild(span);
      el.appendChild(document.createTextNode(' '));
    });
  }
  buildWords('headline1', 'bro plz jp can i get your loke', 0);
  buildWords('headline2', 'btw how was spiderman brand new day?', 0.9);

  // radar trackers scattered around
  const trackerContainer = document.getElementById('trackers');
  const trackerSpots = [
    [8,14],[88,10],[14,80],[85,78],[50,6],[6,48],[94,46],[30,90],[70,20],[46,88]
  ];
  trackerSpots.forEach(([left, top], i) => {
    const size = 70 + Math.random() * 90;
    const t = document.createElement('div');
    t.className = 'tracker';
    t.style.left = left + 'vw';
    t.style.top = top + 'vh';
    t.style.width = size + 'px';
    t.style.height = size + 'px';
    t.innerHTML = `
      <div class="ring r1" style="width:${size}px;height:${size}px;"></div>
      <div class="ring r2" style="width:${size}px;height:${size}px;"></div>
      <div class="ring r3" style="width:${size}px;height:${size}px;"></div>
      <div class="dot"></div>
    `;
    t.style.animationDelay = (Math.random() * 1.5) + 's';
    trackerContainer.appendChild(t);
  });

  // twinkling ambient blue dots
  const sparkContainer = document.getElementById('sparks');
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('span');
    s.className = 'spark';
    const size = 2 + Math.random() * 3.5;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.top = (Math.random() * 100) + 'vh';
    s.style.animationDuration = (1.4 + Math.random() * 2.2) + 's';
    s.style.animationDelay = (Math.random() * 3) + 's';
    sparkContainer.appendChild(s);
  }

  // continuously spawning rising particles
  const pinContainer = document.getElementById('pins');
  const emojis = ['📍', '🙏', '😭', '📌', '💫', '❗'];
  function spawnPin(){
    const p = document.createElement('span');
    p.className = 'pin';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.fontSize = (14 + Math.random() * 20) + 'px';
    const duration = 10 + Math.random() * 10;
    p.style.animationDuration = duration + 's';
    pinContainer.appendChild(p);
    setTimeout(() => p.remove(), duration * 1000 + 200);
  }
  for (let i = 0; i < 14; i++) {
    setTimeout(spawnPin, Math.random() * 4000);
  }
  setInterval(spawnPin, 550);

  // click burst
  document.getElementById('body').addEventListener('click', (e) => {
    const burstEmojis = ['📍', '🙏', '😭', '📌', '💥', '✨'];
    for (let i = 0; i < 12; i++) {
      const el = document.createElement('span');
      el.className = 'burst-emoji';
      el.textContent = burstEmojis[Math.floor(Math.random() * burstEmojis.length)];
      el.style.left = e.clientX + 'px';
      el.style.top = e.clientY + 'px';
      const angle = Math.random() * Math.PI * 2;
      const dist = 70 + Math.random() * 110;
      el.style.setProperty('--end', `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`);
      el.style.setProperty('--rot', (Math.random() * 220 - 110) + 'deg');
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }
  });
</script>

</body>
</html>
